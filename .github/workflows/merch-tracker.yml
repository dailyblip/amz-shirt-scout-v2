name: Merch Tracker

# One run a day. Each run spends nearly the whole 60-token Keepa bucket
# (about 11 for the search plus 1 per listing), so do not add more schedules
# and do not run it within an hour of the manual Merch Probe.
on:
  workflow_dispatch:
  schedule:
    # 13:17 UTC = 5:17 AM PST / 6:17 AM PDT.
    - cron: "17 13 * * *"

permissions:
  contents: write

concurrency:
  group: merch-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search Keepa and save today's ranks
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m src.merch_tracker
      - name: Commit today's snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/merch_tracker
          # Commit BEFORE pulling: `git pull --rebase` aborts on a dirty tree.
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Save Merch tracker snapshot"
          git pull --rebase
          git push
